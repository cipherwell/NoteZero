name: Release

# Manual, signed release. Signing material comes from repository secrets and is never
# committed. If secrets are absent the release variant builds UNSIGNED (distributor signs).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName to build (must match app/build.gradle.kts)'
        required: true
        default: '0.1.0'
      sign:
        description: 'Sign with the NoteZero upload key (secrets required)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Offline guarantee
        run: ./scripts/check-offline.sh --gradle

      - name: Decode signing key
        if: ${{ inputs.sign }}
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTEZERO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOTEZERO_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NOTEZERO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::NOTEZERO signing secrets missing but sign=true"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/notezero-upload.jks"
          chmod 600 "$RUNNER_TEMP/signing/notezero-upload.jks"
          {
            echo "NOTEZERO_KEYSTORE_PATH=$RUNNER_TEMP/signing/notezero-upload.jks"
            echo "NOTEZERO_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NOTEZERO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: |
          set -o pipefail
          ./gradlew clean :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee release-build.log

      - name: Verify signature
        if: ${{ inputs.sign }}
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee apksigner.txt
          grep -q "FA:CA:DD:67:B2:82:AF:A5:E7:F4:C9:C4:70:61:71:80:C9:EF:9E:2D:12:39:AD:F1:0C:29:C4:F9:95:AA:92:78" apksigner.txt \
            || { echo "::error::APK is not signed with the NoteZero upload key"; exit 1; }

      - name: Checksums
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk >> SHA256SUMS 2>/dev/null || true
          sha256sum app/build/outputs/bundle/release/app-release.aab >> SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: notezero-release-${{ inputs.version_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            SHA256SUMS
            release-build.log
          if-no-files-found: error
