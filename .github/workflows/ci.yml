name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # No legacy `tools` package: it was removed from the SDK repository and
          # makes the action fail. Platform/build-tools come from the next step.
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Debug keystore
        run: ./scripts/gen-debug-keystore.sh

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Offline guarantee (permissions + sources + dependencies)
        run: ./scripts/check-offline.sh --gradle

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notezero-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source-level offline audit (no Gradle needed)
        run: ./scripts/check-offline.sh

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No key material committed
        run: |
          set -e
          if git ls-files | grep -Ei '\.(jks|keystore|p12)$|keystore\.properties|\.env$'; then
            echo "KEY MATERIAL COMMITTED — remove it and rotate the key" >&2
            exit 1
          fi
          echo "no key material in the repository"
