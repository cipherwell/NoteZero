# F-Droid build recipe — NoteZero
#
# Status: ready to submit once the public repository reaches the 3-month eligibility window
# (SPEC.md: 3-month rule from public repo creation, 2026-11-15 → submission window 2027-02-15).
#
# Reproducible builds: NoteZero release APKs are verified byte-for-byte reproducible
# (docs/REPRODUCIBLE-BUILDS.md) with the pinned toolchain below; F-Droid's build server must
# use the same JDK/Gradle/AGP/Kotlin/SDK/build-tools and SOURCE_DATE_EPOCH for the binary
# comparison to succeed.
#
# The release variant is intentionally UNSIGNED when NOTEZERO_KEYSTORE_PATH is absent, which
# is exactly what F-Droid's build server expects; F-Droid signs with its own key.
Categories:
  - Security
  - Note
License: MIT
AuthorName: Cipherwell
AuthorEmail: 25090180+cipherwell@users.noreply.github.com
WebSite: https://github.com/cipherwell/NoteZero
SourceCode: https://github.com/cipherwell/NoteZero
IssueTracker: https://github.com/cipherwell/NoteZero/issues
Changelog: https://github.com/cipherwell/NoteZero/blob/main/CHANGELOG.md
PrivacyPolicy: https://github.com/cipherwell/NoteZero/blob/main/PRIVACY.md

AutoName: NoteZero
RepoType: git
Repo: https://github.com/cipherwell/NoteZero.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    gradle:
      - yes
    ndk: absent
    # Release builds are unsigned unless the signing env is set, so no special flags are
    # needed here. Repro notes:
    #   JDK 17, Gradle 9.3.1 (wrapper), AGP 9.1.1, Kotlin 2.2.10, SDK android-36,
    #   build-tools 36.0.0, SOURCE_DATE_EPOCH=1763054400 (docs/REPRODUCIBLE-BUILDS.md).
    prebuild: echo "NoteZero — no prebuild steps (AGP 9.1.1, JDK 17, SDK 36)"

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|versionCode = (\d+)|.|versionName = "([^"]+)"
CurrentVersion: 0.1.0
CurrentVersionCode: 1
